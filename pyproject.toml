[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "blackjack_predictor"
version = "0.0.1"
description = "Prediction for Blackjack"
authors = [
  { name = "DTU", email = "your@email.com" },
]
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bentoml>=1.4.31",
    "dvc[gdrive,gs]>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "dvc-gs>=3.0.0",
    "fastapi>=0.116.0",
    "gdown==5.2.0",
    "onnx>=1.19.0",
    "onnxruntime>=1.22.1",
    "pandas==3.0.3",
    "pytorch-lightning>=2.6.5",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "pep8>=1.7.1",
    "evidently>=0.7.21",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "wandb>=0.27.2",
    "pillow>=12.2.0",
    "python-multipart>=0.0.32",
    "streamlit>=1.58.0",
    "requests>=2.34.2",
    "onnx>=1.22.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
    "dvc>=3.67.1",
    "pandas-stubs",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 150
line-ending = "lf"

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (auto-sorting imports)
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.coverage.run]
omit = ["tests/*", "/tmp/*"]
disable_warnings = ["no-data-collected", "module-not-measured"]

[tool.coverage.report]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["src"]
