[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "blackjack_predictor"
version = "0.0.1"
description = "Prediction for Blackjack"
authors = [
  { name = "DTU", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc[gdrive]>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "fastapi==0.115.6",
    "gdown==5.2.0",
    "pandas==3.0.3",
    "pytorch-lightning>=2.6.5",
    "pywin32>=312",
    "torch==2.6.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "pep8>=1.7.1",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
    "dvc>=3.67.1",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
