workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: europe-west1-docker.pkg.dev/dtumlops-499809/dtumlops/blackjack-train
      env:
        - name: WANDB_MODE
          value: offline
      args:
        - data_config.processed_path=/gcs/dtumlops-499809-training-data/data/raw
        - data_config.model_path=/gcs/dtumlops-499809-training-data/models/model.pth
        - training_config.max_epochs=10
        - training_config.batch_size=128