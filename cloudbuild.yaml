steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "Build container image"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "."
      - "-t"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/dtumlops/blackjack-train"
      - "-f"
      - "dockerfiles/train_uv.dockerfile"

  - name: "gcr.io/cloud-builders/docker"
    id: "Push container image"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/dtumlops/blackjack-train"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy to Cloud Run"
    args:
      - "run"
      - "deploy"
      - "blackjack-predictor-api"
      - "--source=."
      - "--port=8080"
      - "--region=europe-west1"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY