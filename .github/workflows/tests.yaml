name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ["ubuntu-latest"]
        python-version: ["3.12"]
        pytorch-version: ["2.6.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ matrix.operating-system }}-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ matrix.operating-system }}-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --dev
          uv tree

      - name: Run tests & coverage
        run: |
          uv run coverage run -m pytest tests/test_model.py::test_model_forward_shape tests/test_data.py
          uv run coverage report -m
