name: Check staged model

on:
  repository_dispatch:
    types: staged_model

jobs:
  identify_event:
    runs-on: ubuntu-latest
    outputs:
      model_name: ${{ steps.set_output.outputs.model_name }}
    steps:
      - name: Check event type
        run: |
          echo "Event type: repository_dispatch"
          echo "Payload Data: ${{ toJson(github.event.client_payload) }}"

      - name: Setting model environment variable and output
        id: set_output
        run: |
          echo "model_name=${{ github.event.client_payload.artifact_version_string }}" >> $GITHUB_OUTPUT

  test_model:
    runs-on: ubuntu-latest
    needs: identify_event
    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
      WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
      WANDB_MODEL_NAME: ${{ needs.identify_event.outputs.model_name }}
    steps:
    - name: Echo model name
      run: |
        echo "Model name: $WANDB_MODEL_NAME"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache virtual environment
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-ubuntu-latest-3.12-${{ hashFiles('uv.lock') }}
        restore-keys: |
          venv-ubuntu-latest-3.12-

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --locked --dev

    - name: Test model
      run: |
        uv run pytest tests/test_model.py::test_model_speed

  add_production_alias:
    runs-on: ubuntu-latest
    needs: [identify_event, test_model]
    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_ORG: ${{ secrets.WANDB_ORG }}
      WANDB_COLLECTION: ${{ secrets.WANDB_COLLECTION }}
      WANDB_REGISTRY: ${{ secrets.WANDB_REGISTRY }}
      WANDB_MODEL_NAME: ${{ needs.identify_event.outputs.model_name }}
    steps:
    - name: Echo model name
      run: |
        echo "Model name: $WANDB_MODEL_NAME"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache virtual environment
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-ubuntu-latest-3.12-${{ hashFiles('uv.lock') }}
        restore-keys: |
          venv-ubuntu-latest-3.12-

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --locked --dev

    - name: Add production alias
      run: |
        uv run python tests/test_production.py $WANDB_MODEL_NAME --aliases production
