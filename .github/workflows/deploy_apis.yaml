name: Deploy APIs

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: europe-west1
  ARTIFACT_REGISTRY_REPOSITORY: dtumlops
  BLACKJACK_API_SERVICE: blackjack-api
  BLACKJACK_SPECIALIZED_API_SERVICE: blackjack-specialized-api
  LOCUST_USERS: 25
  LOCUST_SPAWN_RATE: 5
  LOCUST_RUN_TIME: 2m

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BLACKJACK_API_IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dtumlops/blackjack-api
      BLACKJACK_SPECIALIZED_API_IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dtumlops/blackjack-specialized-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Create Locust results directory
        run: mkdir -p locust-results

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build blackjack-api image
        run: |
          docker build \
            --file dockerfiles/api_uv.dockerfile \
            --tag ${{ env.BLACKJACK_API_IMAGE }}:latest \
            --tag ${{ env.BLACKJACK_API_IMAGE }}:${{ github.sha }} \
            .

      - name: Push blackjack-api image tags
        run: |
          docker push ${{ env.BLACKJACK_API_IMAGE }}:latest
          docker push ${{ env.BLACKJACK_API_IMAGE }}:${{ github.sha }}

      - name: Deploy blackjack-api
        run: |
          gcloud run deploy ${{ env.BLACKJACK_API_SERVICE }} \
            --image ${{ env.BLACKJACK_API_IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --port 8080 \
            --memory 2Gi \
            --allow-unauthenticated

      - name: Resolve blackjack-api URL
        run: |
          blackjack_api_url=$(gcloud run services describe \
            ${{ env.BLACKJACK_API_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "BLACKJACK_API_URL=$blackjack_api_url" >> "$GITHUB_ENV"

      - name: Run blackjack-api load test
        env:
          API_TYPE: fastapi
        run: |
          mkdir -p locust-results/blackjack-api
          uv run locust -f tests/performancetests/locustfile.py \
            --headless \
            --users "$LOCUST_USERS" \
            --spawn-rate "$LOCUST_SPAWN_RATE" \
            --run-time "$LOCUST_RUN_TIME" \
            --host "$BLACKJACK_API_URL" \
            --csv locust-results/blackjack-api/results

      - name: Upload blackjack-api load test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results-blackjack-api
          path: locust-results/blackjack-api/
          if-no-files-found: error

      - name: Build blackjack-specialized-api image
        run: |
          docker build \
            --file dockerfiles/api_specialized_build.dockerfile \
            --tag ${{ env.BLACKJACK_SPECIALIZED_API_IMAGE }}:latest \
            --tag ${{ env.BLACKJACK_SPECIALIZED_API_IMAGE }}:${{ github.sha }} \
            .

      - name: Push blackjack-specialized-api image tags
        run: |
          docker push ${{ env.BLACKJACK_SPECIALIZED_API_IMAGE }}:latest
          docker push ${{ env.BLACKJACK_SPECIALIZED_API_IMAGE }}:${{ github.sha }}

      - name: Deploy blackjack-specialized-api
        run: |
          gcloud run deploy ${{ env.BLACKJACK_SPECIALIZED_API_SERVICE }} \
            --image ${{ env.BLACKJACK_SPECIALIZED_API_IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --port 3000 \
            --memory 2Gi \
            --allow-unauthenticated

      - name: Resolve blackjack-specialized-api URL
        run: |
          blackjack_specialized_api_url=$(gcloud run services describe \
            ${{ env.BLACKJACK_SPECIALIZED_API_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "BLACKJACK_SPECIALIZED_API_URL=$blackjack_specialized_api_url" >> "$GITHUB_ENV"

      - name: Run blackjack-specialized-api load test
        env:
          API_TYPE: specialized
        run: |
          mkdir -p locust-results/blackjack-specialized-api
          uv run locust -f tests/performancetests/locustfile.py \
            --headless \
            --users "$LOCUST_USERS" \
            --spawn-rate "$LOCUST_SPAWN_RATE" \
            --run-time "$LOCUST_RUN_TIME" \
            --host "$BLACKJACK_SPECIALIZED_API_URL" \
            --csv locust-results/blackjack-specialized-api/results

      - name: Upload blackjack-specialized-api load test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results-blackjack-specialized-api
          path: locust-results/blackjack-specialized-api/
          if-no-files-found: error
